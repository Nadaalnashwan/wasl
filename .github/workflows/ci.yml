name: CI

# Deterministic checks only: no secrets, no live AI providers. Safe for pull requests from forks.
on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app scripts tests
      - name: Unit + integration tests (fake LLM provider)
        run: pytest -q
      - name: Authorization + PII regression (explicit)
        run: pytest -q tests/test_security.py
      - name: Deterministic AI regression evaluation (no LLM; fails on regression vs baseline)
        run: python -m app.eval_v2
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-eval
          path: backend/eval/results/deterministic-latest.*

  supabase-migrations:
    # Applies supabase/migrations to a throwaway PostgreSQL with Supabase-like roles/grants (no real project, no
    # secrets), asserts role-escalation and RLS protections, checks model/schema drift, then runs the backend
    # suite on that database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Apply migrations twice + security assertions
        run: supabase/tests/run_local.sh
      - name: Model / migration drift
        working-directory: backend
        run: PYTHONPATH=. DATABASE_URL=sqlite:///:memory: python ../supabase/tests/schema_drift.py postgresql+psycopg://postgres@localhost:5432/wasl_migration_test
      - name: Backend tests on the migrated PostgreSQL schema
        working-directory: backend
        run: |
          psql "$PGURL/postgres" -c "create database wasl_pytest template wasl_migration_test"
          WASL_TEST_DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/wasl_pytest pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_AUTH_MODE: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Production build (also generates next-env.d.ts)
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
